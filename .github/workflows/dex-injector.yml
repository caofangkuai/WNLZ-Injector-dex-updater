name: DEX Injector

on:
  push:
    paths:
      - '**.py'
      - 'core.dex'
      - 'src/**'
      - '.github/workflows/**'
  schedule:
    - cron: '0 0 */7 * *'
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK 直链地址（留空则自动获取最新版）'
        required: false
        type: string
      version:
        description: '版本号（格式: 版本名称_版本号，如 3.9.15.297907_840297907）'
        required: false
        type: string

env:
  TARGET_REPO: ${{ secrets.TARGET_REPO }}
  ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache baksmali/smali tools
        uses: actions/cache@v4
        with:
           path: tools/
           key: smali-tools-v3

      - name: Download baksmali and smali with dependencies
        run: |
          mkdir -p tools

          # Create a minimal POM to resolve all dependencies via Maven
          cat > tools/pom.xml << 'POMEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>temp</groupId>
            <artifactId>temp</artifactId>
            <version>1.0</version>
            <dependencies>
              <dependency>
                <groupId>org.smali</groupId>
                <artifactId>baksmali</artifactId>
                <version>2.5.2</version>
              </dependency>
              <dependency>
                <groupId>org.smali</groupId>
                <artifactId>smali</artifactId>
                <version>2.5.2</version>
              </dependency>
            </dependencies>
          </project>
          POMEOF

          # Use Maven to download all dependencies (including transitive)
          if command -v mvn &> /dev/null; then
            cd tools && mvn -q dependency:copy-dependencies -DoutputDirectory=jars && cd ..
          else
            # Fallback: download Maven wrapper and use it
            curl -sL "https://repo1.maven.org/maven2/io/takari/maven-wrapper/0.5.6/maven-wrapper-0.5.6.jar" -o tools/maven-wrapper.jar
            # Manual download of known dependencies
            for url in \
              "https://repo1.maven.org/maven2/org/smali/baksmali/2.5.2/baksmali-2.5.2.jar" \
              "https://repo1.maven.org/maven2/org/smali/smali/2.5.2/smali-2.5.2.jar" \
              "https://repo1.maven.org/maven2/org/smali/dexlib2/2.5.2/dexlib2-2.5.2.jar" \
              "https://repo1.maven.org/maven2/org/smali/util/2.5.2/util-2.5.2.jar" \
              "https://repo1.maven.org/maven2/com/google/guava/guava/31.1-jre/guava-31.1-jre.jar" \
              "https://repo1.maven.org/maven2/com/beust/jcommander/1.82/jcommander-1.82.jar" \
              "https://repo1.maven.org/maven2/com/google/code/findbugs/jsr305/3.0.2/jsr305-3.0.2.jar" \
              "https://repo1.maven.org/maven2/com/google/guava/failureaccess/1.0.1/failureaccess-1.0.1.jar" \
              "https://repo1.maven.org/maven2/org/checkerframework/checker-qual/3.12.0/checker-qual-3.12.0.jar" \
              "https://repo1.maven.org/maven2/com/google/errorprone/error_prone_annotations/2.11.0/error_prone_annotations-2.11.0.jar" \
              "https://repo1.maven.org/maven2/com/google/j2objc/j2objc-annotations/1.3/j2objc-annotations-1.3.jar"; do
              fname=$(basename "$url")
              curl -sL --max-time 60 "$url" -o "tools/jars/$fname" || echo "Warning: failed to download $fname"
            done
          fi

          # Verify key jars exist
          for jar in baksmali.jar smali.jar; do
            if [ ! -f "tools/jars/$jar" ]; then
              if [ -f "tools/$jar" ]; then
                mkdir -p tools/jars && mv tools/*.jar tools/jars/ 2>/dev/null || true
              fi
            fi
          done

          ls -la tools/jars/ 2>/dev/null || ls -la tools/

      - name: Install dependencies
        run: |
          pip install requests androguard
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip wget file

      - name: Resolve APK URL
        id: resolve
        env:
          INPUT_APK_URL: ${{ inputs.apk_url }}
          INPUT_VERSION: ${{ inputs.version }}
        run: python3 scripts/resolve_apk_url.py

      - name: Check if release already exists
        id: check_release
        if: steps.resolve.outputs.is_core_dex_trigger != 'true'
        run: |
          VERSION="${{ steps.manifest_version.outputs.version }}"
          TARGET_REPO="${{ secrets.TARGET_REPO }}"

          if [ -z "$TARGET_REPO" ] || [ -z "${{ secrets.ACCESS_TOKEN }}" ]; then
            echo "::error::TARGET_REPO or ACCESS_TOKEN secret is not set"
            exit 1
          fi

          echo "Checking if release $VERSION exists in $TARGET_REPO..."

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.ACCESS_TOKEN }}" \
            "https://api.github.com/repos/$TARGET_REPO/releases/tags/$VERSION")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Release $VERSION already exists"
            ASSET_EXISTS=$(curl -s \
              -H "Authorization: token ${{ secrets.ACCESS_TOKEN }}" \
              "https://api.github.com/repos/$TARGET_REPO/releases/tags/$VERSION" | \
              python3 -c "import sys,json; r=json.load(sys.stdin); print('true' if any(a['name']=='dex.zip' for a in r.get('assets',[])) else 'false')")

            if [ "$ASSET_EXISTS" = "true" ]; then
              echo "dex.zip asset already exists in release $VERSION"
              echo "already_exists=true" >> $GITHUB_OUTPUT
            else
              echo "Release exists but no dex.zip asset"
              echo "already_exists=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Release $VERSION does not exist"
            echo "already_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if already latest
        if: steps.check_release.outputs.already_exists == 'true'
        run: |
          echo "已是最新版本，无需处理"
          echo "SKIP_REMAINING=true" >> $GITHUB_ENV

      - name: Download APK
        if: env.SKIP_REMAINING != 'true'
        run: |
          APK_URL="${{ steps.resolve.outputs.apk_url }}"
          echo "Downloading APK from: $APK_URL"
          wget --progress=dot:giga -O app.apk "$APK_URL"
          ls -la app.apk

      - name: Get version and extract files
        if: env.SKIP_REMAINING != 'true'
        id: manifest_version
        run: |
          VERSION_INPUT="${{ steps.resolve.outputs.version_input }}"

          if [ -n "$VERSION_INPUT" ]; then
            echo "Using user-provided version: $VERSION_INPUT"
            echo "version=$VERSION_INPUT" >> $GITHUB_OUTPUT
          else
            echo "Extracting version from APK..."
            VERSION=$(python3 -c "
          from androguard.core.apk import APK
          apk = APK('app.apk')
          name = apk.get_androidversion_name()
          code = apk.get_androidversion_code()
          if name and code:
              print(f'{name}_{code}')
          else:
              print('unknown')
          ")
            if [ "$VERSION" = "unknown" ]; then
              echo "::error::Could not extract version from APK"
              exit 1
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Extracted version: $VERSION"
          fi

          # Extract needed files from APK
          mkdir -p apk_extracted/assets
          unzip -o app.apk "assets/_ntcfg_.data" "assets/_ntcfgss*.dat" -d apk_extracted 2>/dev/null || true

          if [ ! -f "apk_extracted/assets/_ntcfg_.data" ] && [ ! -f "apk_extracted/_ntcfg_.data" ]; then
            unzip -o app.apk "_ntcfg_.data" "_ntcfgss*.dat" -d apk_extracted 2>/dev/null || true
          fi

          echo "Extracted files:"
          find apk_extracted -type f -ls
          rm -f app.apk

      - name: Decrypt DEX files
        if: env.SKIP_REMAINING != 'true'
        run: |
          mkdir -p work
          cd work

          NTCFG_FILE=$(find ../apk_extracted -name "_ntcfg_.data" | head -1)
          if [ -z "$NTCFG_FILE" ]; then
            echo "::warning::_ntcfg_.data not found, will use default keys"
          fi

          NTCFGSS_FILES=$(find ../apk_extracted -name "_ntcfgss*.dat" | sort)
          if [ -z "$NTCFGSS_FILES" ]; then
            echo "::error::No _ntcfgss*.dat file found in APK"
            exit 1
          fi

          echo "Found ntcfgss files:"
          echo "$NTCFGSS_FILES"

          for NTCFGSS_FILE in $NTCFGSS_FILES; do
            BASENAME=$(basename "$NTCFGSS_FILE")
            DEX_NUM=$(echo "$BASENAME" | sed 's/_ntcfgss//;s/\.dat//')
            if [ -z "$DEX_NUM" ]; then
              DEX_NAME="classes.dex"
            else
              DEX_NAME="classes${DEX_NUM}.dex"
            fi

            echo "Decrypting $BASENAME -> $DEX_NAME"
            if [ -n "$NTCFG_FILE" ]; then
              python3 ../dex_crypto_tool.py decrypt "$NTCFGSS_FILE" "$DEX_NAME" "$NTCFG_FILE"
            else
              python3 ../dex_crypto_tool.py decrypt "$NTCFGSS_FILE" "$DEX_NAME"
            fi

            if [ $? -ne 0 ]; then
              echo "::error::Decryption failed for $BASENAME"
              exit 1
            fi
            echo "Decrypted: $DEX_NAME ($(stat -c%s "$DEX_NAME") bytes)"
          done

          echo "All decrypted DEX files:"
          ls -la *.dex

          echo "NTCFG_FILE=$NTCFG_FILE" >> $GITHUB_ENV
          echo "DEX_COUNT=$(ls *.dex | wc -l)" >> $GITHUB_ENV

          cd ..

      - name: Cache android.jar and d8
        id: cache-android
        uses: actions/cache@v4
        with:
          path: |
            /tmp/android.jar
            /tmp/d8.jar
          key: android-d8-v1

      - name: Download android.jar and d8
        if: env.SKIP_REMAINING != 'true' && steps.cache-android.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 120 \
            "https://github.com/Sable/android-platforms/raw/master/android-34/android.jar" \
            -o /tmp/android.jar

          curl -sL --max-time 120 \
            "https://dl.google.com/android/repository/build-tools_r34-linux.zip" \
            -o /tmp/d8.zip
          mkdir -p /tmp/d8-extract
          unzip -q /tmp/d8.zip -d /tmp/d8-extract
          find /tmp/d8-extract -name "d8.jar" -type f -exec cp {} /tmp/d8.jar \;
          rm -rf /tmp/d8.zip /tmp/d8-extract

          ls -la /tmp/android.jar /tmp/d8.jar

      - name: Set D8 and android.jar paths
        if: env.SKIP_REMAINING != 'true'
        run: |
          echo "ANDROID_JAR=/tmp/android.jar" >> $GITHUB_ENV
          echo "D8_CMD=java -cp /tmp/d8.jar com.android.tools.r8.D8" >> $GITHUB_ENV

      - name: Compile src to DEX
        if: env.SKIP_REMAINING != 'true'
        id: compile_src
        run: |
          cd work

          D8_CMD="${{ env.D8_CMD }}"

          # Find next available classes number
          MAX_NUM=0
          for f in classes*.dex; do
            [ -f "$f" ] || continue
            if [ "$f" = "classes.dex" ]; then
              MAX_NUM=1
            else
              num=$(echo "$f" | sed 's/classes//;s/\.dex//')
              [ -n "$num" ] && [ "$num" -gt "$MAX_NUM" ] 2>/dev/null && MAX_NUM=$num
            fi
          done
          NEXT_NUM=$((MAX_NUM + 1))
          if [ "$NEXT_NUM" -eq 1 ]; then
            CORE_DEX_NAME="classes.dex"
          else
            CORE_DEX_NAME="classes${NEXT_NUM}.dex"
          fi
          echo "Core DEX will be named: $CORE_DEX_NAME"
          echo "core_dex_name=$CORE_DEX_NAME" >> $GITHUB_OUTPUT

          if [ -d "../src" ] && [ "$(find ../src -name '*.java' | head -1)" ]; then
            echo "Compiling src/ to DEX using d8..."

            mkdir -p src_compile/classes

            find ../src -name '*.java' > src_compile/sources.txt
            javac -source 1.8 -target 1.8 -bootclasspath "${{ env.ANDROID_JAR }}" -d src_compile/classes @src_compile/sources.txt 2>&1

            if [ $? -ne 0 ]; then
              echo "::error::Java compilation failed"
              exit 1
            fi

            echo "Java compilation successful"

            # min-api 26 for DEX version 035
            CLASS_FILES=$(find src_compile/classes -name "*.class" | tr '\n' ' ')
            $D8_CMD --min-api 26 --output src_compile/ $CLASS_FILES 2>&1

            if [ $? -ne 0 ] || [ ! -f "src_compile/classes.dex" ]; then
              echo "::error::d8 compilation failed"
              exit 1
            fi

            echo "d8 compilation successful"
            cp src_compile/classes.dex "$CORE_DEX_NAME"
            echo "Generated $CORE_DEX_NAME from src/ directory"
            ls -la "$CORE_DEX_NAME"

          elif [ -f "../core.dex" ]; then
            echo "Using existing core.dex..."
            cp ../core.dex "$CORE_DEX_NAME"
            ls -la "$CORE_DEX_NAME"
          else
            echo "No src/ directory and no core.dex found, skipping"
          fi

          cd ..

      - name: Decompile all DEX to smali
        if: env.SKIP_REMAINING != 'true'
        run: |
          cd work
          mkdir -p smali_work

          for dex_file in classes*.dex; do
            [ -f "$dex_file" ] || continue
            if [ "$dex_file" = "classes.dex" ]; then
              smali_dir="smali_work/smali_classes0"
            else
              num=$(echo "$dex_file" | sed 's/classes//;s/\.dex//')
              smali_dir="smali_work/smali_classes${num}"
            fi
            mkdir -p "$smali_dir"
            echo "Decompiling $dex_file -> $smali_dir"
            java -cp "../tools/jars/*" org.jf.baksmali.Main disassemble "$dex_file" -o "$smali_dir"
          done

          echo "Decompiled smali directories:"
          ls -la smali_work/
          echo "Total smali files: $(find smali_work -name '*.smali' | wc -l)"

          cd ..

      - name: Modify smali code
        if: env.SKIP_REMAINING != 'true'
        run: |
          cd work
          python3 ../smali_modifier.py smali_work
          echo "Smali modification complete"
          cd ..

      - name: Recompile all smali to DEX
        if: env.SKIP_REMAINING != 'true'
        run: |
          cd work

          for smali_dir in smali_work/smali_classes*; do
            [ -d "$smali_dir" ] || continue
            if [ "$smali_dir" = "smali_work/smali_classes0" ]; then
              out_dex="classes.dex"
            else
              num=$(echo "$smali_dir" | sed 's/smali_work\/smali_classes//')
              out_dex="classes${num}.dex"
            fi
            echo "Recompiling $smali_dir -> $out_dex"
            java -cp "../tools/jars/*" org.jf.smali.Main assemble --api 26 "$smali_dir" -o "$out_dex"
            if [ $? -ne 0 ]; then
              echo "::error::Failed to recompile $smali_dir"
              exit 1
            fi
            echo "Recompiled: $out_dex ($(stat -c%s "$out_dex") bytes)"
          done

          echo "All recompiled DEX files:"
          ls -la *.dex

          cd ..

      - name: Encrypt DEX files
        if: env.SKIP_REMAINING != 'true'
        run: |
          cd work
          mkdir -p encrypted

          NTCFG_FILE="$NTCFG_FILE"

          for dex in classes*.dex; do
            [ -f "$dex" ] || continue
            OUTPUT="encrypted/$dex"
            if [ -n "$NTCFG_FILE" ]; then
              python3 ../dex_crypto_tool.py encrypt "$dex" "$OUTPUT" "$NTCFG_FILE"
            else
              python3 ../dex_crypto_tool.py encrypt "$dex" "$OUTPUT"
            fi
            if [ $? -ne 0 ]; then
              echo "::error::Failed to encrypt $dex"
              exit 1
            fi
            echo "Encrypted $dex -> $OUTPUT ($(stat -c%s "$OUTPUT") bytes)"
          done

          echo "Encrypted files:"
          ls -la encrypted/

          cd ..

      - name: Create dex.zip
        if: env.SKIP_REMAINING != 'true'
        run: |
          cd work
          zip -j dex.zip encrypted/*.dex
          echo "Created dex.zip:"
          ls -la dex.zip
          unzip -l dex.zip
          cd ..

      - name: Upload DEX artifact
        if: env.SKIP_REMAINING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: modified-dex-${{ steps.manifest_version.outputs.version }}
          path: work/classes*.dex
          retention-days: 7

      - name: Upload release asset
        if: env.SKIP_REMAINING != 'true'
        run: |
          VERSION="${{ steps.manifest_version.outputs.version }}"
          TARGET_REPO="${{ secrets.TARGET_REPO }}"

          if [ -z "$TARGET_REPO" ] || [ -z "${{ secrets.ACCESS_TOKEN }}" ]; then
            echo "::error::TARGET_REPO or ACCESS_TOKEN secret is not set"
            exit 1
          fi

          # Check if release already exists
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.ACCESS_TOKEN }}" \
            "https://api.github.com/repos/$TARGET_REPO/releases/tags/$VERSION")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Creating release $VERSION..."
            CREATE_RESPONSE=$(curl -s -X POST \
              -H "Authorization: token ${{ secrets.ACCESS_TOKEN }}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$TARGET_REPO/releases" \
              -d "{
                \"tag_name\": \"$VERSION\",
                \"name\": \"$VERSION\",
                \"body\": \"Auto-generated release for version $VERSION\",
                \"draft\": false,
                \"prerelease\": false
              }")

            RELEASE_ID=$(echo "$CREATE_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

            if [ -z "$RELEASE_ID" ]; then
              echo "::error::Failed to create release"
              echo "$CREATE_RESPONSE"
              exit 1
            fi

            echo "Created release with ID: $RELEASE_ID"
          else
            RELEASE_ID=$(curl -s \
              -H "Authorization: token ${{ secrets.ACCESS_TOKEN }}" \
              "https://api.github.com/repos/$TARGET_REPO/releases/tags/$VERSION" | \
              python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

            echo "Using existing release with ID: $RELEASE_ID"
          fi

          # Delete existing assets
          for ASSET_NAME in dex.zip; do
            EXISTING_ASSET=$(curl -s \
              -H "Authorization: token ${{ secrets.ACCESS_TOKEN }}" \
              "https://api.github.com/repos/$TARGET_REPO/releases/$RELEASE_ID/assets" | \
              python3 -c "import sys,json; assets=json.load(sys.stdin); result=[a['id'] for a in assets if a['name']=='$ASSET_NAME']; print(result[0] if result else '')" 2>/dev/null)

            if [ -n "$EXISTING_ASSET" ]; then
              echo "Deleting existing $ASSET_NAME (ID: $EXISTING_ASSET)"
              curl -s -X DELETE \
                -H "Authorization: token ${{ secrets.ACCESS_TOKEN }}" \
                "https://api.github.com/repos/$TARGET_REPO/releases/assets/$EXISTING_ASSET"
            fi
          done

          # Upload dex.zip
          echo "Uploading dex.zip..."
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.ACCESS_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @work/dex.zip \
            "https://uploads.github.com/repos/$TARGET_REPO/releases/$RELEASE_ID/assets?name=dex.zip"

          echo "Upload complete"

      - name: Cleanup
        if: always() && env.SKIP_REMAINING != 'true'
        run: |
          rm -rf work apk_extracted apk_full app.apk
          echo "Cleanup complete"
